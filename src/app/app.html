<nz-layout class="app-layout">

  <nz-sider class="menu-sidebar" nzCollapsible nzWidth="256px" nzBreakpoint="md" [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null">
    <div class="sidebar-logo">
      <h1>FJ-NDRRP 2018-2030</h1>
    </div>

    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
      <li nz-submenu nzOpen nzTitle="Dashboard" nzIcon="dashboard">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/home">Home</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/outcome">Outcomes</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/activity">Activities</a>
          </li>
        </ul>
      </li>
      <li nz-submenu nzOpen nzTitle="Frameworks" nzIcon="paper-clip">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/sendai">SENDAI</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/frdp">FRDP</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/ndrrp">NDRRP</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/ndp">NDP</a>
          </li>
        </ul>
      </li>
      <li nz-submenu nzOpen nzTitle="Reports" nzIcon="form">
        <ul>
          <li nz-menu-item>
            <a routerLink="/report">Progress Tracker</a>
          </li>
          <li nz-menu-item>
            <a routerLink="/report">National Reporting</a>
          </li>
          <li nz-menu-item>
            <a routerLink="/report">Regional Reporting</a>
          </li>
          <li nz-menu-item>
            <a routerLink="/report">Global Reporting</a>
          </li>
          <li nz-menu-item>
            <a routerLink="/report">Cross-cutting Analysis</a>
          </li>
          <li nz-menu-item>
            <a routerLink="/report">Gap Analysis</a>
          </li>
        </ul>
      </li>
    </ul>
  </nz-sider>
  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
          <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
        </span>
      </div>
    </nz-header>
    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
      <div style="text-align: center;">
        &copy; 2026 <a target="_blank" href="https://www.agenticpacific.com.fj">Agentic Pacific</a>. All Rights
        Reserved.
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
